# Drives the goblin's turns.
#
# The route to the coin doesn't change once it's found (the coin never moves), so it's
# planned once, up front (createPlanFor - see docs/functions.md and
# engine/src/game/agent.ts), and stashed here as a queue of commands. Every player
# turn, one command is popped off the queue and carried out (executeCommandAs) - one
# step per turn, same pace as a player would move.
#
# An agent facing a world that CAN invalidate its plan (an item moves, a door gets
# shut) would instead call createPlanFor again from afterTurn() every turn, to stay
# responsive - see docs/traits.md#driving-an-agents-turns. That's a heavier pattern
# than this one: afterTurn() is a global rule, so it also runs inside every command
# createPlanFor itself simulates while searching (simulated commands still run their
# full before/after-turn rule phases, to model a real turn accurately). A rule that
# replans from afterTurn() therefore also fires inside its own search - createPlan
# guards against that specific case recursing without end (see
# engine/src/game/agent.ts#PLANNING), but it's still doing a full fresh search on
# every node the search visits, which is far more work than popping one command off a
# list. Since the goblin's goal here never changes, planning once in beforeGame() -
# before afterTurn() has anything queued to act on - gets the cheaper behaviour for
# free: those simulated turns find nothing queued yet and do nothing.
rule: goblinBrain
plan: []
beforeGame():
  - plan = createPlanFor('goblin', isAtLocation(coin, goblin), ['go', 'get'], 5)
afterTurn():
  - if: Array.length(plan) > 0
    then:
      - step = plan[0]
      - Array.splice(plan, 0, 1)
      - executeCommandAs('goblin', step)
      - print('[goblin] ' + Array.join(step, ' '))
